name: Python validation demo tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate fictional approved claims
        run: python -m demo.validator examples/evidence.json examples/claims_valid.json

      - name: Verify fictional unapproved claims are rejected
        shell: bash
        run: |
          set +e
          python -m demo.validator examples/evidence.json examples/claims.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected exit status 1 for rejected claims; got $status"
            exit 1
          fi
